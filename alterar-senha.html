<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alterar senha</title>
    <link rel="stylesheet" href="src/styles/global.css">
    <link rel="stylesheet" href="src/styles/form.css">
    <link rel="icon" href="img/cabeca.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="login">
        <div class="logo">
            <img src="img/logo-completa.png" alt="Logo da plataforma">
            <h2>Alterar senha</h2>
        </div>

        <form id="alterarSenhaForm">
            <div class="senha">
                <label>Senha atual</label>
                <div class="input-container">
                    <input type="password" id="senhaAtual" placeholder="Digite sua senha atual" required autocomplete="current-password">
                    <i class="fa-regular fa-eye-slash password-icon"></i>
                </div>
            </div>

            <div class="senha">
                <label>Nova senha</label>
                <div class="input-container">
                    <input type="password" id="novaSenha" placeholder="Digite sua nova senha" required autocomplete="new-password">
                    <i class="fa-regular fa-eye-slash password-icon"></i>
                </div>
                <ul class="password-criteria" id="passwordCriteria">
                    <li id="critMinimo">Mínimo de 8 caracteres</li>
                    <li id="critMaiuscula">1 letra maiúscula</li>
                    <li id="critMinuscula">1 letra minúscula</li>
                    <li id="critNumero">1 número</li>
                    <li id="critEspecial">1 caractere especial</li>
                </ul>
            </div>

            <div class="senha">
                <label>Confirmar nova senha</label>
                <div class="input-container">
                    <input type="password" id="confirmarNovaSenha" placeholder="Confirme sua nova senha" required autocomplete="new-password">
                    <i class="fa-regular fa-eye-slash password-icon"></i>
                </div>
            </div>

            <button type="submit" class="btn-continue">
                Alterar senha &rarr;
            </button>
        </form>

        <div class="ajuda">
            <p><a href="conta_aluno.html">Voltar</a></p>
        </div>
    </div>

    <div id="alerta" style="display:none; padding: 12px; border-radius: 5px; margin-bottom: 15px; font-size: 14px;"></div>

    <script src="src/scripts/validationFom.js"></script>
    <script type="module" src="src/scripts/alterarSenha.js"></script>
</body>
</html>
