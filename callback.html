<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirme seu email</title>
    <link rel="stylesheet" href="src/styles/global.css">
    <link rel="stylesheet" href="src/styles/form.css">
    <link rel="icon" href="img/cabeca.png">
</head>

<body>
    <div class="login" style="text-align: center;">
        <div class="logo">
            <img src="img/logo-completa.png" alt="Logo da plataforma">
        </div>

        <div class="callback-content">
            <h2>📧 Verifique seu email</h2>
            <p class="callback-text">
                Enviamos um link de confirmação para <strong id="emailDisplay"></strong>.
            </p>
            <p class="callback-subtext">
                Clique no link enviado no email para ativar sua conta.
            </p>
            <div class="callback-box">
                <p class="callback-box-text">Não recebeu o email?</p>
                <p class="callback-box-subtext">Verifique a caixa de spam ou lixeira.</p>
            </div>
            <p class="callback-link">
                <a href="inicio.html">Voltar para o início</a>
            </p>
        </div>
    </div>

    <script>
        const saved = localStorage.getItem("theme");
        if (saved === "dark") document.body.classList.add("dark");

        const params = new URLSearchParams(window.location.search);
        const email = params.get("email");
        if (email) {
            document.getElementById("emailDisplay").textContent = email;
        }
    </script>
</body>

</html>
