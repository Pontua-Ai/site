<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>inicio</title>
    <link rel="stylesheet" href="src/styles/global.css">
    <link rel="stylesheet" href="src/styles/form.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="icon" href="img/cabeca.png">

</head>
<body>
    <div class="login">
        <div class="logo">
            <img src="img/logo-completa.png" alt="Logo da plataforma">
            <h2>Bem vindo de volta</h2>
        </div>
        
        <form id="loginForm">
        <div class="entrar">
            <label>E-mail</label>
            <input type="email" name="email" id="loginEmail" placeholder="Digite seu E-mail" required>
        </div>

        <div class="senha">
            <label>Senha</label>
            <div class="input-container">
            <input type="password" id="loginPassword" placeholder="Digite sua senha" required>
            <i class="fa-regular fa-eye-slash password-icon"></i>
            </div>
        </div>

        <button type="submit" class="btn-continue"> 
            Continue &rarr; 
        </button>
        </form>

        <div class="ajuda">
            <p>Ainda não possui conta? <a href="cadastro.html">Cadastre-se gratuitamente</a> </p>
            <a href="#">Esqueceu a senha?</a>
            
        </div>
    </div>

    <div id="alerta" style="display:none; padding: 12px; border-radius: 5px; margin-bottom: 15px; font-size: 14px;"></div>

    <script src="src/scripts/validationFom.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        if (params.get("confirmado") === "true") {
            const alerta = document.getElementById("alerta");
            alerta.style.display = "block";
            alerta.style.backgroundColor = "#d4edda";
            alerta.style.color = "#155724";
            alerta.style.border = "1px solid #c3e6cb";
            alerta.textContent = "Conta confirmada com sucesso! Faça login para continuar.";
        } else if (params.get("erro")) {
            const alerta = document.getElementById("alerta");
            alerta.style.display = "block";
            alerta.style.backgroundColor = "#f8d7da";
            alerta.style.color = "#721c24";
            alerta.style.border = "1px solid #f5c6cb";
            alerta.textContent = decodeURIComponent(params.get("erro"));
        }
    </script>
    <script type="module" src="src/scripts/app.js"></script>
</body>
</html>
